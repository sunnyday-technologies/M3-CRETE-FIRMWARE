# ============================================================================
# M3-CRETE — Klipper config  ·  STAGE 1: Z-AXIS BRING-UP ONLY
# ============================================================================
# Printer:    M3-2 (2000 x 1000 x 1000 mm concrete 3D printer)
# Controller: BigTreeTech Kraken v1.0 (STM32H723, 8x onboard TMC5160)
# Host:       Raspberry Pi 5
# Motors:     4x NEMA23  StepperOnline 23HS22-2804S  (1.24 N·m, 2.8 A/phase)
# Repo:       github.com/sunnyday-technologies/M3-CRETE
# ----------------------------------------------------------------------------
# SCOPE OF THIS FILE
#   This is a deliberately minimal config to commission ONLY the four Z
#   motors, wired to the first four driver slots (S1..S4 / "MOTOR 1-4").
#   Goal: spin each motor, confirm direction, then ZERO each one using the
#   TMC5160's built-in StallGuard load sensing ("overload sensing") as the
#   homing setpoint — no physical endstops.
#
# WHAT IS *NOT* HERE YET (added in later stages):
#   - X axis (belt-pinion), Y axis (dual), extruder, feed pump
#   - input shaping / ADXL345, z_tilt probe, print macros
#   X and Y exist below only as INERT STUBS, because Klipper's cartesian
#   kinematics refuses to load without an X/Y/Z. They have no motors wired,
#   no driver config, and must NOT be jogged or homed. Do not run a bare G28.
#
# PIN SOURCE: BigTreeTech official "generic-bigtreetech-kraken.cfg"
#   (Kraken uses SOFTWARE SPI on PC6/PC8/PC7 and sense_resistor 0.022 — these
#    differ from generic TMC5160 module configs; do not copy from elsewhere.)
#
# Driver / slot allocation for this stage:
#   S1 (MOTOR1) -> stepper_z    (Z corner 0)   cs PD6  diag PC15
#   S2 (MOTOR2) -> stepper_z1   (Z corner 1)   cs PD5  diag PF0
#   S3 (MOTOR3) -> stepper_z2   (Z corner 2)   cs PD4  diag PF1
#   S4 (MOTOR4) -> stepper_z3   (Z corner 3)   cs PD3  diag PF2
#   S5 (MOTOR5) -> stepper_x    STUB (no motor)
#   S6 (MOTOR6) -> stepper_y    STUB (no motor)
# ============================================================================


# ----------------------------------------------------------------------------
# MCU — BTT Kraken v1.0
# Mainsail UI helpers — virtual_sdcard, PAUSE/RESUME/CANCEL_PRINT macros.
# mainsail.cfg ships with MainsailOS in this same config directory. If you
# run a different host stack (Fluidd, bare Klipper), comment this out.
[include mainsail.cfg]

# ----------------------------------------------------------------------------
# Firmware build flags (cd ~/klipper && make menuconfig):
#   [*] Enable extra low-level configuration options   <-- CHECK THIS FIRST
#       Without it, the "Bootloader offset" and "Clock Reference" menus never
#       appear and the build silently assumes the wrong crystal — firmware
#       that boots dead on the Kraken (no USB, no error message).
#   Micro-controller Architecture ......... STMicroelectronics STM32
#   Processor model ....................... STM32H723
#   Bootloader offset ..................... 128KiB bootloader  (see below)
#   Clock Reference ....................... 25 MHz crystal
#   Communication interface ............... USB (on PA11/PA12)
# Then `make`, copy out/klipper.bin to the Kraken's microSD as firmware.bin,
# power-cycle to flash.
#
# If SD flashing does nothing (firmware.bin never renames to FIRMWARE.CUR):
# some Kraken boards ship with BLANK flash — no BTT bootloader — and the SD
# method can never work on them. Flash over USB DFU instead; full procedure
# and troubleshooting are in README.md next to this file.
# ----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_XXXXXXXXXXXX-if00
# ^ Replace XXXX after first flash. On the Pi run:  ls /dev/serial/by-id/


# ----------------------------------------------------------------------------
# Kinematics — conservative limits (Z is all that moves in this stage)
# ----------------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
max_z_velocity: 20            # mm/s — belt-driven Z, start slow
max_z_accel: 200              # mm/s²
square_corner_velocity: 5.0


# ----------------------------------------------------------------------------
# force_move — lets us jog one stepper at a time before homing exists
# ----------------------------------------------------------------------------
[force_move]
enable_force_move: True

# Needed for M118 (console echo in macros), M117 status, and Mainsail/Fluidd.
[respond]
[display_status]


# ============================================================================
# Z MOTORS — 4 independent steppers, sensorless StallGuard homing UP
# ============================================================================
# All four are members of the Z axis. Each carries its own endstop_pin
# (its own driver's StallGuard virtual endstop), so on `G28 Z` they drive
# up together and EACH stops independently the moment its corner stalls
# against the top brace — giving 4-corner coplanarity with no probe.
#
# Home direction is UP: position_endstop == position_max, so Klipper homes
# toward +Z. homing_retract_dist MUST be 0 for sensorless (no second touch).
#
# FIRST-POWER ORDER (do NOT skip):
#   1. ZHOLD                      -> energize all 4 (listen/feel for holding)
#   2. ZJOG MOTOR=0 DIST=5 VEL=3  -> verify motor 0 spins; repeat 1,2,3
#      If a motor turns the WRONG way, flip the '!' on its dir_pin below.
#   3. Raise run_current toward load, then tune driver_SGT (see ZSTATUS).
#   4. HOME_Z                     -> sensorless quad home + zero.
# ============================================================================

# ---- Z corner 0  (S1 / MOTOR1) ---------------------------------------------
[stepper_z]
step_pin: PC14
dir_pin: PC13                # add/remove '!' if this corner jogs the wrong way
enable_pin: !PE6
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40        # GT2 2mm pitch x 20T pulley — calibrate later
endstop_pin: tmc5160_stepper_z:virtual_endstop
position_endstop: 1000       # = position_max  -> home UP into top brace
position_min: -5
position_max: 1000
homing_speed: 8              # slow — belts under gantry mass
homing_retract_dist: 0       # REQUIRED 0 for sensorless (no re-touch)

# ---- Z corner 1  (S2 / MOTOR2) ---------------------------------------------
[stepper_z1]
step_pin: PE5
dir_pin: PE4                 # add/remove '!' if this corner jogs the wrong way
enable_pin: !PE3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc5160_stepper_z1:virtual_endstop

# ---- Z corner 2  (S3 / MOTOR3) ---------------------------------------------
[stepper_z2]
step_pin: PE2
dir_pin: PE1                 # add/remove '!' if this corner jogs the wrong way
enable_pin: !PE0
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc5160_stepper_z2:virtual_endstop

# ---- Z corner 3  (S4 / MOTOR4) ---------------------------------------------
[stepper_z3]
step_pin: PB9
dir_pin: PB8                 # add/remove '!' if this corner jogs the wrong way
enable_pin: !PB7
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc5160_stepper_z3:virtual_endstop


# ============================================================================
# TMC5160 drivers for the 4 Z motors
# ============================================================================
# sense_resistor 0.022 is the Kraken's onboard value — DO NOT change it.
# software SPI bus is shared by all drivers (repeat the 3 pins per section).
#
# run_current: motor is rated 2.8 A/phase  ->  ~1.98 A RMS max.
#   Start at 1.2 A to verify wiring/thermals, then raise toward 1.5-1.8 A for
#   real gantry load. NEVER exceed ~2.0 A RMS. Re-tune driver_SGT whenever you
#   change run_current (StallGuard sensitivity moves with current).
#
# driver_SGT: StallGuard2 threshold, -64 (most sensitive) .. +63 (least).
#   Stalls too early / before the brace  -> RAISE SGT (less sensitive)
#   Crashes into brace without stopping  -> LOWER SGT (more sensitive)
#   Start at 2 and iterate. Use ZSTATUS to watch live load values.
#
# NOTE: stealthchop_threshold is intentionally OMITTED -> drivers run in
# spreadCycle, which StallGuard2 needs to sense load reliably.
#
# HARDWARE: install the DIAG jumper for each of the 4 driver slots, or the
# virtual endstop never sees the stall signal.
# ============================================================================

[tmc5160 stepper_z]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.022
diag1_pin: PC15              # try '^PC15' if stall is never detected
driver_SGT: 2

[tmc5160 stepper_z1]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.022
diag1_pin: PF0
driver_SGT: 2

[tmc5160 stepper_z2]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.022
diag1_pin: PF1
driver_SGT: 2

[tmc5160 stepper_z3]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.022
diag1_pin: PF2
driver_SGT: 2


# ============================================================================
# X / Y STUBS — placeholders so cartesian kinematics will load. NO MOTORS.
# ============================================================================
# Do not jog or home these. They have no TMC config (drivers stay inert) and
# point at unused filament-sensor header pins as never-triggered dummy
# endstops. Replaced with real X (belt-pinion) and Y (dual) in Stage 2.
# ============================================================================
[stepper_x]
step_pin: PG9                # S5 slot — nothing wired
dir_pin: PG10
enable_pin: !PG13
microsteps: 16
rotation_distance: 40
endstop_pin: PF3            # dummy (unused material_0 header) — never homed
position_endstop: 0
position_min: 0
position_max: 2000

[stepper_y]
step_pin: PG11               # S6 slot — nothing wired
dir_pin: PD7
enable_pin: !PG12
microsteps: 16
rotation_distance: 40
endstop_pin: PF4            # dummy (unused material_1 header) — never homed
position_endstop: 0
position_min: 0
position_max: 1000


# ============================================================================
# BRING-UP MACROS
# ============================================================================

# ---- Energize / release all 4 Z motors -------------------------------------
[gcode_macro ZHOLD]
description: Energize all 4 Z motors (hold torque on)
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z  ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=1
    M118 All Z motors energized

[gcode_macro ZRELEASE]
description: De-energize all 4 Z motors (free to turn by hand)
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z  ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=0
    M118 All Z motors released

# ---- Jog ONE motor (open-loop, no homing needed) ---------------------------
# Usage:  ZJOG MOTOR=0 DIST=10 VEL=5      (MOTOR 0..3, DIST mm +up/-down)
[gcode_macro ZJOG]
description: Force-move one Z motor to check spin + direction
gcode:
    {% set names = ['stepper_z','stepper_z1','stepper_z2','stepper_z3'] %}
    {% set m = params.MOTOR|default(0)|int %}
    {% if m < 0 or m > 3 %}
        { action_raise_error("MOTOR must be 0..3") }
    {% endif %}
    FORCE_MOVE STEPPER={names[m]} DISTANCE={params.DIST|default(10)|float} VELOCITY={params.VEL|default(5)|float} ACCEL=100
    M118 Jogged {names[m]} by {params.DIST|default(10)}mm

# ---- StallGuard / driver readout for SGT tuning ----------------------------
[gcode_macro ZSTATUS]
description: Dump TMC StallGuard + driver state for all 4 Z motors
gcode:
    DUMP_TMC STEPPER=stepper_z
    DUMP_TMC STEPPER=stepper_z1
    DUMP_TMC STEPPER=stepper_z2
    DUMP_TMC STEPPER=stepper_z3

# ---- Sensorless quad-Z home (drives UP until each corner stalls) ------------
# Homes only Z. Each corner zeroes itself at its own stall point.
[gcode_macro HOME_Z]
description: Sensorless quad-Z home to top brace, then back off 5mm
gcode:
    M118 Homing Z (sensorless, 4 corners independent)
    G28 Z
    G4 P300                  # let TMC stall latches clear
    G91
    G1 Z-5 F300              # back off the brace
    G90
    M118 Z homed — corners coplanar at top
